[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "catora-api"
version = "0.1.0"
description = "Catora enterprise catalog intelligence API"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "boto3==1.40.6",
  "celery==5.6.3",
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "google-auth==2.56.0",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "redis==5.3.1",
  "requests==2.34.2",
  "sqlalchemy==2.0.51",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0"
]

[project.urls]
Repository = "https://github.com/waseem99/Catora"
Issues = "https://github.com/waseem99/Catora/issues"
Security = "https://github.com/waseem99/Catora/security"

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.8"
]

[tool.hatch.build.targets.wheel]
packages = ["catora_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "boto3",
  "boto3.*",
  "botocore",
  "botocore.*",
  "celery",
  "celery.*",
  "google",
  "google.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "catora_api.measurement.google"
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "catora_api.api.measurement"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "catora_api.schemas.restaurant_bridge"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "catora_api.api.restaurant_bridge"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "catora_api.normalization.restaurant_bridge"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "catora_api.operations_console.reconciler"
disable_error_code = ["arg-type", "unused-ignore"]

[[tool.mypy.overrides]]
module = "catora_api.operations_console.service"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error:Using httpx with starlette.testclient is deprecated.*:DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"catora_api/authority/service.py" = ["F401"]
"catora_api/db/models/operations_console.py" = ["E501", "I001"]
"catora_api/measurement/google.py" = ["E501"]
"catora_api/normalization/restaurant_bridge.py" = ["F401"]
"catora_api/operations_console/reconciler.py" = ["E501", "B009"]
"catora_api/schemas/restaurant_bridge.py" = ["UP040"]
