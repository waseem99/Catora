services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: catora
      POSTGRES_USER: catora
      POSTGRES_PASSWORD: ${CATORA_SELF_HOSTED_POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catora -d catora"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CATORA_SELF_HOSTED_S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${CATORA_SELF_HOSTED_S3_SECRET_KEY:?required}
    volumes:
      - minio-data:/data

  storage-init:
    profiles: ["ops"]
    image: ghcr.io/waseem99/catora-api@${CATORA_PRODUCTION_API_IMAGE_DIGEST:?required}
    env_file:
      - ${CATORA_PRODUCTION_ENV_FILE:-.env.production}
    environment:
      CATORA_S3_ENDPOINT_URL: http://minio:9000
      CATORA_S3_ACCESS_KEY: ${CATORA_SELF_HOSTED_S3_ACCESS_KEY:?required}
      CATORA_S3_SECRET_KEY: ${CATORA_SELF_HOSTED_S3_SECRET_KEY:?required}
      CATORA_S3_BUCKET: ${CATORA_SELF_HOSTED_S3_BUCKET:-catora}
    command:
      - python
      - -c
      - |
        import os
        import boto3
        client = boto3.client(
            "s3",
            endpoint_url=os.environ["CATORA_S3_ENDPOINT_URL"],
            aws_access_key_id=os.environ["CATORA_S3_ACCESS_KEY"],
            aws_secret_access_key=os.environ["CATORA_S3_SECRET_KEY"],
        )
        bucket = os.environ["CATORA_S3_BUCKET"]
        buckets = {item["Name"] for item in client.list_buckets().get("Buckets", [])}
        if bucket not in buckets:
            client.create_bucket(Bucket=bucket)
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  migrate:
    environment:
      CATORA_DATABASE_URL: postgresql+asyncpg://catora:${CATORA_SELF_HOSTED_POSTGRES_PASSWORD:?required}@postgres:5432/catora
      CATORA_REDIS_URL: redis://redis:6379/0
      CATORA_S3_ENDPOINT_URL: http://minio:9000
      CATORA_S3_ACCESS_KEY: ${CATORA_SELF_HOSTED_S3_ACCESS_KEY:?required}
      CATORA_S3_SECRET_KEY: ${CATORA_SELF_HOSTED_S3_SECRET_KEY:?required}
      CATORA_S3_BUCKET: ${CATORA_SELF_HOSTED_S3_BUCKET:-catora}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  api:
    environment:
      CATORA_DATABASE_URL: postgresql+asyncpg://catora:${CATORA_SELF_HOSTED_POSTGRES_PASSWORD:?required}@postgres:5432/catora
      CATORA_REDIS_URL: redis://redis:6379/0
      CATORA_S3_ENDPOINT_URL: http://minio:9000
      CATORA_S3_ACCESS_KEY: ${CATORA_SELF_HOSTED_S3_ACCESS_KEY:?required}
      CATORA_S3_SECRET_KEY: ${CATORA_SELF_HOSTED_S3_SECRET_KEY:?required}
      CATORA_S3_BUCKET: ${CATORA_SELF_HOSTED_S3_BUCKET:-catora}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    environment:
      CATORA_DATABASE_URL: postgresql+asyncpg://catora:${CATORA_SELF_HOSTED_POSTGRES_PASSWORD:?required}@postgres:5432/catora
      CATORA_REDIS_URL: redis://redis:6379/0
      CATORA_S3_ENDPOINT_URL: http://minio:9000
      CATORA_S3_ACCESS_KEY: ${CATORA_SELF_HOSTED_S3_ACCESS_KEY:?required}
      CATORA_S3_SECRET_KEY: ${CATORA_SELF_HOSTED_S3_SECRET_KEY:?required}
      CATORA_S3_BUCKET: ${CATORA_SELF_HOSTED_S3_BUCKET:-catora}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
