name: Refresh Next security lock

on:
  push:
    branches: [security/next-16.3.3]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/next-16.3.3
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile for patched Next.js
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Next.js 16.3.3"
          git push origin HEAD:security/next-16.3.3
