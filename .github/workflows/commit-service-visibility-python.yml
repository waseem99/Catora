name: Commit service visibility Python corrections

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/commit-service-visibility-python.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  commit:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Apply reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/^          python - <<'PY'$/,/^          PY$/p" .github/workflows/fix-service-visibility-mypy.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_service_visibility_fixes.py
          python /tmp/apply_service_visibility_fixes.py
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/catora_api/connectors/public_catalog.py')
          text = path.read_text()
          text = text.replace(
              '            if self.source_type == "wordpress":\n                fields = (\n',
              '            fields: tuple[str, ...]\n            if self.source_type == "wordpress":\n                fields = (\n',
          )
          path.write_text(text)
          PY
          python -m ruff check --fix \
            apps/api/catora_api/api/service_visibility.py \
            apps/api/catora_api/connectors/public_catalog.py \
            apps/api/catora_api/connectors/wordpress.py \
            apps/api/catora_api/service_visibility \
            apps/api/catora_api/schemas/service_visibility.py \
            apps/api/tests/test_service_visibility.py
          git diff --check
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/catora_api/api/service_visibility.py \
            apps/api/catora_api/connectors/public_catalog.py \
            apps/api/catora_api/connectors/wordpress.py \
            apps/api/catora_api/service_visibility/models.py \
            apps/api/catora_api/service_visibility/reporting.py \
            apps/api/catora_api/service_visibility/tasks.py \
            apps/api/tests/test_service_visibility.py
          git commit -m 'Fix service visibility strict Python checks'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
