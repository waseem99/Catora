name: Export service visibility audit worktree

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-service-visibility-audit.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/catora-service-visibility-audit.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: catora-service-visibility-audit-worktree
          path: /tmp/catora-service-visibility-audit.tar.gz
          retention-days: 1
