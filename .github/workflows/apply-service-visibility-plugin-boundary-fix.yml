name: Apply service visibility plugin boundary fix

on:
  push:
    branches:
      - main
    paths:
      - .github/service-visibility-plugin-boundary-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wordpress-service-visibility-rebuild
          fetch-depth: 0
      - name: Recover and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 7eedbc0ecfa2435390cb2a725e5c1a37c53dc919
          git show 7eedbc0ecfa2435390cb2a725e5c1a37c53dc919:.github/workflows/apply-service-visibility-plugin-boundaries.yml > /tmp/plugin-boundary-workflow.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/plugin-boundary-workflow.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply-plugin-boundaries.py
          test -s /tmp/apply-plugin-boundaries.py
          set +e
          output="$(python /tmp/apply-plugin-boundaries.py 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$output" != "Expected release validator plugin safety check not found" ]; then
            printf '%s\n' "$output" >&2
            exit "$result"
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_service_visibility_release.py")
          text = path.read_text()
          if '"plugin.service_visibility.explicit_schedule"' not in text:
              marker = '''        _check(
              "workflow.service_visibility.main",
          '''
              insertion = '''        _check(
              "plugin.service_visibility.explicit_schedule",
              "enable_scheduled_sync" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              )
              and "scheduled_sync" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              ),
              "scheduled snapshots require explicit WordPress opt-in",
              "scheduled snapshots must remain disabled until explicitly enabled",
          ),
          _check(
              "plugin.service_visibility.draft_retry_idempotency",
              "_catora_proposal_id" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              )
              and "get_posts" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              ),
              "approved draft retries reuse the existing proposal draft",
              "draft delivery must not create duplicates after callback failures",
          ),
'''
              if marker not in text:
                  raise SystemExit("Release validator workflow check insertion point not found")
              text = text.replace(marker, insertion + marker, 1)
              path.write_text(text)
          PY
      - name: Validate plugin and release boundary
        run: |
          find apps/wordpress-service-visibility -name '*.php' -print0 | xargs -0 -n1 php -l
          python scripts/validate_service_visibility_release.py
          bash apps/wordpress-service-visibility/build-plugin.sh artifacts/service-visibility/catora-service-visibility.zip
          unzip -t artifacts/service-visibility/catora-service-visibility.zip
      - name: Commit safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/wordpress-service-visibility/includes/class-catora-service-visibility.php \
            apps/wordpress-service-visibility/README.md \
            scripts/validate_service_visibility_release.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Require explicit plugin schedules and deduplicate drafts'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
