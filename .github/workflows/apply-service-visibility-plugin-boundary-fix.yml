name: Apply service visibility plugin boundary fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-service-visibility-plugin-boundaries.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Recover and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/apply-service-visibility-plugin-boundaries.yml > /tmp/plugin-boundary-workflow.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/plugin-boundary-workflow.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply-plugin-boundaries.py
          test -s /tmp/apply-plugin-boundaries.py
          python /tmp/apply-plugin-boundaries.py
      - name: Validate plugin and release boundary
        run: |
          find apps/wordpress-service-visibility -name '*.php' -print0 | xargs -0 -n1 php -l
          python scripts/validate_service_visibility_release.py
          bash apps/wordpress-service-visibility/build-plugin.sh artifacts/service-visibility/catora-service-visibility.zip
          unzip -t artifacts/service-visibility/catora-service-visibility.zip
      - name: Commit safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/wordpress-service-visibility/includes/class-catora-service-visibility.php \
            apps/wordpress-service-visibility/README.md \
            scripts/validate_service_visibility_release.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Require explicit plugin schedules and deduplicate drafts'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
