name: Apply service visibility API typing fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-service-visibility-rebuild-typing-fix.yml
      - apps/api/catora_api/api/service_visibility.py

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Apply exact draft ID type narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/catora_api/api/service_visibility.py')
          text = path.read_text()
          old_header = '''def _draft_view(source: CatalogSource, draft: dict[str, object]) -> DraftProposalView:
              return DraftProposalView(
          '''.replace('              ', '    ')
          new_header = '''def _draft_view(source: CatalogSource, draft: dict[str, object]) -> DraftProposalView:
              remote_draft_id = draft.get("remote_draft_id")
              return DraftProposalView(
          '''.replace('              ', '    ')
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif new_header not in text:
              raise SystemExit('Expected _draft_view header not found')

          old_value = '''        remote_draft_id=int(draft["remote_draft_id"]) if isinstance(draft.get("remote_draft_id"), int) else None,
          '''
          new_value = '''        remote_draft_id=(
              remote_draft_id
              if isinstance(remote_draft_id, int) and not isinstance(remote_draft_id, bool)
              else None
          ),
          '''
          if old_value in text:
              text = text.replace(old_value, new_value, 1)
          elif new_value not in text:
              raise SystemExit('Expected remote_draft_id expression not found')
          path.write_text(text)
          PY
      - name: Verify focused API checks
        run: |
          python -m ruff check apps/api/catora_api/api/service_visibility.py
          python -m mypy --config-file apps/api/pyproject.toml apps/api/catora_api/api/service_visibility.py
          python -m pytest -q apps/api/tests/test_service_visibility.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/catora_api/api/service_visibility.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/catora_api/api/service_visibility.py
          git commit -m 'Fix service visibility draft ID typing'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
