name: Apply service visibility API typing fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-service-visibility-rebuild-typing-fix.yml
      - apps/api/catora_api/api/service_visibility.py

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Format and verify service visibility API
        run: |
          python -m ruff format apps/api/catora_api/api/service_visibility.py
          python -m ruff check apps/api/catora_api/api/service_visibility.py
          python -m mypy --config-file apps/api/pyproject.toml apps/api/catora_api/api/service_visibility.py
          python -m pytest -q apps/api/tests/test_service_visibility.py
      - name: Commit formatting correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/catora_api/api/service_visibility.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/catora_api/api/service_visibility.py
          git commit -m 'Format service visibility draft ID fix'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
