name: Catalog bridge temporary patch

on:
  push:
    branches:
      - agent/node-mongo-catalog-bridge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/node-mongo-catalog-bridge
      - name: Normalize sensitive catalog field tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = '''const ForbiddenFieldTokens = new Set([\n  "customer",\n  "customers",\n  "order",\n  "orders",\n  "payment",\n  "payments",\n  "password",\n  "passwords",\n  "session",\n  "sessions",\n  "token",\n  "tokens",\n  "address",\n  "addresses",\n]);\n\nfunction containsForbiddenFieldToken(value: string): boolean {\n  const normalized = value\n    .replace(/([a-z0-9])([A-Z])/g, "$1_$2")\n    .toLowerCase();\n  return normalized\n    .split(/[_\\-.]+/)\n    .some((token) => ForbiddenFieldTokens.has(token));\n}\n'''

          contract = Path("packages/contracts/src/catalog-bridge.ts")
          content = contract.read_text(encoding="utf-8")
          content = content.replace(
              'const ForbiddenFieldPattern =\n  /(^|[_\\-.])(customer|customers|order|orders|payment|payments|password|passwords|session|sessions|token|tokens|address|addresses)([_\\-.]|$)/i;\n',
              helper,
          )
          content = content.replace(
              '.refine((value) => !ForbiddenFieldPattern.test(value), {',
              '.refine((value) => !containsForbiddenFieldToken(value), {',
          )
          contract.write_text(content, encoding="utf-8")

          mongo = Path("packages/catalog-bridge/src/mongo.ts")
          content = mongo.read_text(encoding="utf-8")
          content = content.replace(
              'const ForbiddenKeyPattern =\n  /(^|[_\\-.])(customer|customers|order|orders|payment|payments|password|passwords|session|sessions|token|tokens|address|addresses)([_\\-.]|$)/i;\n',
              helper.replace("ForbiddenField", "ForbiddenKey"),
          )
          content = content.replace(
              'if (ForbiddenKeyPattern.test(key) || key.startsWith("__")) {',
              'if (containsForbiddenKeyToken(key) || key.startsWith("__")) {',
          )
          mongo.write_text(content, encoding="utf-8")

          schema = Path("apps/api/catora_api/schemas/catalog_bridge.py")
          content = schema.read_text(encoding="utf-8")
          old = '''_FORBIDDEN_FIELD = re.compile(\n    r"(^|[_\\-.])(customer|customers|order|orders|payment|payments|password|passwords|"\n    r"session|sessions|token|tokens|address|addresses)([_\\-.]|$)",\n    re.IGNORECASE,\n)\n'''
          new = '''_FORBIDDEN_FIELD_TOKENS = frozenset(\n    {\n        "customer",\n        "customers",\n        "order",\n        "orders",\n        "payment",\n        "payments",\n        "password",\n        "passwords",\n        "session",\n        "sessions",\n        "token",\n        "tokens",\n        "address",\n        "addresses",\n    }\n)\n\n\ndef _contains_forbidden_field_token(value: str) -> bool:\n    normalized = re.sub(r"(?<=[a-z0-9])(?=[A-Z])", "_", value).lower()\n    return any(\n        token in _FORBIDDEN_FIELD_TOKENS\n        for token in re.split(r"[_\\-.]+", normalized)\n    )\n'''
          content = content.replace(old, new)
          content = content.replace(
              "if not key or len(key) > 160 or _FORBIDDEN_FIELD.search(key):",
              "if not key or len(key) > 160 or _contains_forbidden_field_token(key):",
          )
          schema.write_text(content, encoding="utf-8")
          PY
          npm exec prettier -- --write \
            packages/contracts/src/catalog-bridge.ts \
            packages/catalog-bridge/src/mongo.ts
          python -m pip install --quiet ruff
          python -m ruff check --fix --exit-zero apps/api/catora_api/schemas/catalog_bridge.py
          python -m ruff format apps/api/catora_api/schemas/catalog_bridge.py
          if git diff --quiet -- \
            packages/contracts/src/catalog-bridge.ts \
            packages/catalog-bridge/src/mongo.ts \
            apps/api/catora_api/schemas/catalog_bridge.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/catalog-bridge.ts \
            packages/catalog-bridge/src/mongo.ts \
            apps/api/catora_api/schemas/catalog_bridge.py
          git commit -m "Harden catalog bridge sensitive key detection"
          git push origin HEAD:agent/node-mongo-catalog-bridge
