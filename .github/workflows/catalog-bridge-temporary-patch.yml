name: Catalog bridge temporary patch

on:
  push:
    branches:
      - agent/node-mongo-catalog-bridge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/node-mongo-catalog-bridge
      - name: Apply strict typing corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          normalization = Path("apps/api/catora_api/normalization/catalog_bridge.py")
          content = normalization.read_text(encoding="utf-8").replace(
              '            return cast(list[JsonScalar], scalars), "list"',
              '            return scalars, "list"',
          )
          normalization.write_text(content, encoding="utf-8")

          security = Path("apps/api/catora_api/catalog_bridge/security.py")
          content = security.read_text(encoding="utf-8")
          content = content.replace(
              "from datetime import UTC, datetime\n",
              "from datetime import UTC, datetime\nfrom typing import NoReturn\n",
          )
          content = content.replace(
              "    def _reject(detail: str) -> None:\n",
              "    def _reject(detail: str) -> NoReturn:\n",
          )
          security.write_text(content, encoding="utf-8")

          api = Path("apps/api/catora_api/api/catalog_bridge.py")
          content = api.read_text(encoding="utf-8")
          content = content.replace(
              "from pydantic import ValidationError\n",
              "from pydantic import HttpUrl, ValidationError\n",
          )
          content = content.replace(
              "        endpoint=endpoint,\n",
              "        endpoint=HttpUrl(endpoint),\n",
              1,
          )
          content = content.replace(
              '        endpoint=str(request.base_url).rstrip("/"),\n',
              '        endpoint=HttpUrl(str(request.base_url).rstrip("/")),\n',
              1,
          )
          api.write_text(content, encoding="utf-8")
          PY
          python -m pip install --quiet ruff
          python -m ruff check --fix --exit-zero \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge/security.py \
            apps/api/catora_api/normalization/catalog_bridge.py
          python -m ruff format \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge/security.py \
            apps/api/catora_api/normalization/catalog_bridge.py
          if git diff --quiet -- \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge/security.py \
            apps/api/catora_api/normalization/catalog_bridge.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge/security.py \
            apps/api/catora_api/normalization/catalog_bridge.py
          git commit -m "Correct catalog bridge strict typing"
          git push origin HEAD:agent/node-mongo-catalog-bridge
