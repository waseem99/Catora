name: Catalog bridge temporary patch

on:
  push:
    branches:
      - agent/node-mongo-catalog-bridge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/node-mongo-catalog-bridge
      - name: Correct bridge status type import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/catalog-bridge/src/mongo.ts")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              '  type CatalogBridgeProduct,\n  type CatalogBridgeVariant,\n} from "@catora/contracts";',
              '  type CatalogBridgeProduct,\n  type CatalogBridgeSnapshotStatus,\n  type CatalogBridgeVariant,\n} from "@catora/contracts";',
          )
          content = content.replace(
              '  CatalogBridgeClient,\n  type CatalogBridgeClientOptions,\n  type CatalogBridgeSnapshotStatus,\n} from "./client.js";',
              '  CatalogBridgeClient,\n  type CatalogBridgeClientOptions,\n} from "./client.js";',
          )
          path.write_text(content, encoding="utf-8")
          PY
          if git diff --quiet -- packages/catalog-bridge/src/mongo.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/catalog-bridge/src/mongo.ts
          git commit -m "Correct catalog bridge status type import"
          git push origin HEAD:agent/node-mongo-catalog-bridge
