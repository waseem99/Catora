name: Apply service visibility bundle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/service-visibility-bundle/**
      - .github/workflows/apply-service-visibility-bundle.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decode and validate bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/service-visibility.tar.gz
          extract=/tmp/service-visibility-extract
          test -d .github/service-visibility-bundle
          cat .github/service-visibility-bundle/chunk-* | tr -d '\r\n' | base64 --decode > "$bundle"
          gzip -t "$bundle"
          rm -rf "$extract"
          mkdir -p "$extract"
          python - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/service-visibility.tar.gz')
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              if not members:
                  raise SystemExit('Bundle is empty')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if path.parts and path.parts[0] == '.git':
                      raise SystemExit(f'Git metadata is forbidden: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'Unsupported archive member type: {member.name}')
              tar.extractall('/tmp/service-visibility-extract')
          PY

      - name: Apply and validate expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/service-visibility-extract/ ./
          rm -rf .github/service-visibility-bundle
          rm -f .github/workflows/apply-service-visibility-bundle.yml
          git diff --check
          python -m compileall -q apps/api/catora_api/service_visibility
          if command -v php >/dev/null 2>&1 && [ -d apps/wordpress-service-visibility ]; then
            find apps/wordpress-service-visibility -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          fi
          if git grep -n -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- . ':!*.lock'; then
            echo 'Potential credential material detected' >&2
            exit 1
          fi

      - name: Commit expanded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand WordPress service visibility implementation'
          git push origin HEAD:agent/wordpress-service-visibility
