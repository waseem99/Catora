name: Service visibility contract

on:
  pull_request:
    paths:
      - apps/api/pyproject.toml
      - apps/api/catora_api/api/__init__.py
      - apps/api/catora_api/api/service_visibility.py
      - apps/api/catora_api/main.py
      - apps/api/catora_api/schemas/service_visibility.py
      - apps/api/catora_api/service_visibility/**
      - apps/api/catora_api/worker.py
      - apps/api/tests/test_service_visibility.py
      - apps/wordpress-service-visibility/**
      - docs/service-visibility-runbook.md
      - .github/workflows/service-visibility-contract.yml
  push:
    branches:
      - main
    paths:
      - apps/api/pyproject.toml
      - apps/api/catora_api/api/__init__.py
      - apps/api/catora_api/api/service_visibility.py
      - apps/api/catora_api/main.py
      - apps/api/catora_api/schemas/service_visibility.py
      - apps/api/catora_api/service_visibility/**
      - apps/api/catora_api/worker.py
      - apps/api/tests/test_service_visibility.py
      - apps/wordpress-service-visibility/**
      - docs/service-visibility-runbook.md
      - .github/workflows/service-visibility-contract.yml

permissions:
  contents: write

jobs:
  apply-api-typing-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/wordpress-service-visibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact full-repository MyPy fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/catora_api/api/service_visibility.py')
          text = path.read_text()
          replacements = [
              (
                  'from pydantic import ValidationError',
                  'from pydantic import HttpUrl, ValidationError',
              ),
              (
                  '''    endpoint = None
    if token is not None:
        endpoint = f"{str(request.base_url).rstrip('/')}/api/v1/service-visibility/sources/{source.id}/snapshots"
''',
                  '''    endpoint: HttpUrl | None = None
    if token is not None:
        endpoint = HttpUrl(
            f"{str(request.base_url).rstrip('/')}/api/v1/service-visibility/sources/{source.id}/snapshots"
        )
''',
              ),
              (
                  '''    job = await session.get(IngestionJob, uuid.UUID(str(active["job_id"])))
    if job is None:
        raise HTTPException(status_code=409, detail="WordPress snapshot job is unavailable")
    checkpoint = dict(job.checkpoint)
    sequences = [int(value) for value in checkpoint.get("received_sequences", [])]
''',
                  '''    current_job = await session.get(IngestionJob, uuid.UUID(str(active["job_id"])))
    if current_job is None:
        raise HTTPException(status_code=409, detail="WordPress snapshot job is unavailable")
    job = current_job
    checkpoint = dict(job.checkpoint)
    sequences_value = checkpoint.get("received_sequences")
    sequences = (
        [int(value) for value in sequences_value]
        if isinstance(sequences_value, list)
        else []
    )
''',
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected API typing pattern not found: {old[:80]!r}')
          if changed:
              path.write_text(text)
          PY
          python -m compileall -q apps/api/catora_api/api/service_visibility.py
          if git diff --quiet -- apps/api/catora_api/api/service_visibility.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/catora_api/api/service_visibility.py
          git commit -m 'Fix service visibility API typing'
          git push origin HEAD:agent/wordpress-service-visibility

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install API test dependencies
        run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Python checks
        run: |
          python -m compileall -q \
            apps/api/catora_api/service_visibility \
            apps/api/catora_api/schemas/service_visibility.py \
            apps/api/catora_api/api/service_visibility.py
          python -m ruff check \
            apps/api/catora_api/service_visibility \
            apps/api/catora_api/schemas/service_visibility.py \
            apps/api/catora_api/api/service_visibility.py \
            apps/api/tests/test_service_visibility.py
          python -m mypy \
            --config-file apps/api/pyproject.toml \
            apps/api/catora_api/service_visibility \
            apps/api/catora_api/schemas/service_visibility.py
          python -m pytest -q apps/api/tests/test_service_visibility.py
      - name: WordPress checks and package
        run: |
          find apps/wordpress-service-visibility -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          ! grep -RniE '(wc_get_orders|shop_order|WP_User_Query|wp_users|wp_usermeta|wp_signon|wp_set_auth_cookie)' \
            apps/wordpress-service-visibility/catora-service-visibility.php
          mkdir -p /tmp/catora-plugin/catora-service-visibility
          cp -R apps/wordpress-service-visibility/. /tmp/catora-plugin/catora-service-visibility/
          (cd /tmp/catora-plugin && zip -r "$GITHUB_WORKSPACE/catora-service-visibility.zip" catora-service-visibility)
      - uses: actions/upload-artifact@v4
        with:
          name: catora-service-visibility-plugin
          path: catora-service-visibility.zip
          if-no-files-found: error

  wordpress-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start clean WordPress
        shell: bash
        run: |
          set -euo pipefail
          docker network create catora-service-visibility
          docker volume create catora-wordpress-data
          docker run -d --name catora-db \
            --network catora-service-visibility \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=wordpress \
            -e MARIADB_USER=wordpress \
            -e MARIADB_PASSWORD=wordpress \
            mariadb:11.4
          until docker exec catora-db mariadb-admin ping -h localhost -uroot -proot --silent; do sleep 2; done
          docker run -d --name catora-wordpress \
            --network catora-service-visibility \
            -p 8080:80 \
            -e WORDPRESS_DB_HOST=catora-db:3306 \
            -e WORDPRESS_DB_NAME=wordpress \
            -e WORDPRESS_DB_USER=wordpress \
            -e WORDPRESS_DB_PASSWORD=wordpress \
            -v catora-wordpress-data:/var/www/html \
            wordpress:php8.3-apache
          until curl --fail --silent http://127.0.0.1:8080/wp-admin/install.php >/dev/null; do sleep 2; done
      - name: Install and activate plugin
        shell: bash
        run: |
          set -euo pipefail
          wp() {
            docker run --rm \
              --network catora-service-visibility \
              -e WORDPRESS_DB_HOST=catora-db:3306 \
              -e WORDPRESS_DB_NAME=wordpress \
              -e WORDPRESS_DB_USER=wordpress \
              -e WORDPRESS_DB_PASSWORD=wordpress \
              -v catora-wordpress-data:/var/www/html \
              wordpress:cli-php8.3 wp "$@" --allow-root
          }
          wp core install \
            --url=http://127.0.0.1:8080 \
            --title='Catora Plugin Smoke' \
            --admin_user=admin \
            --admin_password='test-only-password' \
            --admin_email=admin@example.com \
            --skip-email
          docker cp apps/wordpress-service-visibility catora-wordpress:/var/www/html/wp-content/plugins/catora-service-visibility
          wp plugin activate catora-service-visibility
          wp option update catora_sv_endpoint 'https://api.example.com/api/v1/service-visibility/sources/00000000-0000-0000-0000-000000000000/snapshots'
          wp option update catora_sv_token 'test-only-read-only-token'
          wp option update catora_sv_scheduled_enabled '1'
          wp eval 'Catora_Service_Visibility::ensure_schedule();'
          wp cron event list --fields=hook --format=csv | grep -q catora_sv_scheduled_sync
          wp plugin deactivate catora-service-visibility
          if wp cron event list --fields=hook --format=csv | grep -q catora_sv_scheduled_sync; then
            echo 'Deactivation left the scheduled export enabled' >&2
            exit 1
          fi
      - name: Clean up WordPress smoke environment
        if: always()
        run: |
          docker rm -f catora-wordpress catora-db >/dev/null 2>&1 || true
          docker volume rm catora-wordpress-data >/dev/null 2>&1 || true
          docker network rm catora-service-visibility >/dev/null 2>&1 || true
