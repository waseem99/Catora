name: Diagnose service visibility CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-service-visibility-ci.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/wordpress-service-visibility-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Fix migration import order
        run: python -m ruff check --fix apps/api/alembic/versions/0019_wordpress_service_visibility.py
      - name: Record redacted Gitleaks metadata
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/gitleaks-service-visibility.json
          jq '[.[] | {RuleID, Description, File, StartLine, EndLine}]' \
            gitleaks-service-visibility.json > gitleaks-service-visibility-redacted.json
          rm -f gitleaks-service-visibility.json
          cat gitleaks-service-visibility-redacted.json
      - uses: actions/upload-artifact@v4
        with:
          name: service-visibility-gitleaks-metadata
          path: gitleaks-service-visibility-redacted.json
          retention-days: 1
          if-no-files-found: error
      - name: Commit migration correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/alembic/versions/0019_wordpress_service_visibility.py
          git commit -m 'Fix service visibility migration formatting'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
