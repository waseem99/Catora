name: Catalog bridge contract

on:
  push:
    branches:
      - agent/node-mongo-catalog-bridge
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/contracts/**"
      - "packages/catalog-bridge/**"
      - "apps/api/alembic/versions/**"
      - "apps/api/catora_api/api/catalog_bridge.py"
      - "apps/api/catora_api/catalog_bridge/**"
      - "apps/api/catora_api/connectors/catalog_bridge.py"
      - "apps/api/catora_api/normalization/catalog_bridge.py"
      - "apps/api/catora_api/schemas/catalog_bridge.py"
      - "apps/api/tests/test_catalog_bridge.py"
      - ".github/workflows/catalog-bridge-contract.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/contracts/**"
      - "packages/catalog-bridge/**"
      - "apps/api/alembic/versions/**"
      - "apps/api/catora_api/api/catalog_bridge.py"
      - "apps/api/catora_api/catalog_bridge/**"
      - "apps/api/catora_api/connectors/catalog_bridge.py"
      - "apps/api/catora_api/normalization/catalog_bridge.py"
      - "apps/api/catora_api/schemas/catalog_bridge.py"
      - "apps/api/tests/test_catalog_bridge.py"
      - ".github/workflows/catalog-bridge-contract.yml"

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Generate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize catalog bridge lockfile"
          git push origin HEAD:${{ github.ref_name }}
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: catalog-bridge-package-lock
          path: package-lock.json
          retention-days: 3
      - name: Install locked dependencies
        run: npm ci
      - name: Lint bridge packages
        shell: bash
        run: |
          set +e
          npm run lint --workspace @catora/contracts > catalog-bridge-lint.txt 2>&1
          status=$?
          npm run lint --workspace @catora/catalog-bridge >> catalog-bridge-lint.txt 2>&1 || status=$?
          cat catalog-bridge-lint.txt
          exit "$status"
      - name: Upload bridge lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-bridge-lint-report
          path: catalog-bridge-lint.txt
          retention-days: 3
      - name: Type-check bridge packages
        shell: bash
        run: |
          set +e
          npm run typecheck --workspace @catora/contracts > catalog-bridge-typecheck.txt 2>&1
          status=$?
          npm run typecheck --workspace @catora/catalog-bridge >> catalog-bridge-typecheck.txt 2>&1 || status=$?
          cat catalog-bridge-typecheck.txt
          exit "$status"
      - name: Upload bridge typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-bridge-typecheck-report
          path: catalog-bridge-typecheck.txt
          retention-days: 3
      - name: Test bridge packages
        run: npm run test --workspace @catora/contracts && npm run test --workspace @catora/catalog-bridge
      - name: Build bridge packages
        run: npm run build --workspace @catora/contracts && npm run build --workspace @catora/catalog-bridge

  api-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catora
          POSTGRES_PASSWORD: catora
          POSTGRES_DB: catora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catora -d catora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATORA_ENVIRONMENT: test
      CATORA_DATABASE_URL: postgresql+asyncpg://catora:catora@localhost:5432/catora_test
      CATORA_CATALOG_BRIDGE_ENABLED: "true"
      CATORA_CATALOG_BRIDGE_CREDENTIAL_ENCRYPTION_KEY: YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --quiet -e 'apps/api[dev]'
      - name: Apply focused Python fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          files=(
            apps/api/catora_api/api/catalog_bridge.py
            apps/api/catora_api/catalog_bridge
            apps/api/catora_api/connectors/catalog_bridge.py
            apps/api/catora_api/normalization/catalog_bridge.py
            apps/api/catora_api/schemas/catalog_bridge.py
            apps/api/tests/test_catalog_bridge.py
          )
          python -m ruff check --fix --exit-zero "${files[@]}"
          python -m ruff format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Format catalog bridge Python"
          git push origin HEAD:${{ github.ref_name }}
      - run: cd apps/api && alembic upgrade head
      - name: Run focused Ruff
        shell: bash
        run: |
          set +e
          python -m ruff check \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge \
            apps/api/catora_api/connectors/catalog_bridge.py \
            apps/api/catora_api/normalization/catalog_bridge.py \
            apps/api/catora_api/schemas/catalog_bridge.py \
            apps/api/tests/test_catalog_bridge.py \
            > catalog-bridge-ruff.txt 2>&1
          status=$?
          cat catalog-bridge-ruff.txt
          exit "$status"
      - name: Upload focused Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-bridge-ruff-report
          path: catalog-bridge-ruff.txt
          retention-days: 3
      - name: Run focused strict MyPy
        shell: bash
        run: |
          set +e
          python -m mypy --config-file apps/api/pyproject.toml \
            apps/api/catora_api/api/catalog_bridge.py \
            apps/api/catora_api/catalog_bridge \
            apps/api/catora_api/connectors/catalog_bridge.py \
            apps/api/catora_api/normalization/catalog_bridge.py \
            apps/api/catora_api/schemas/catalog_bridge.py \
            > catalog-bridge-mypy.txt 2>&1
          status=$?
          cat catalog-bridge-mypy.txt
          exit "$status"
      - name: Upload focused MyPy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-bridge-mypy-report
          path: catalog-bridge-mypy.txt
          retention-days: 3
      - run: python -m pytest -q apps/api/tests/test_catalog_bridge.py
