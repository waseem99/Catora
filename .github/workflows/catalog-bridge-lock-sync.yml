name: Catalog bridge lock sync

on:
  push:
    branches:
      - agent/node-mongo-catalog-bridge

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/node-mongo-catalog-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize catalog bridge bundler lockfile"
          git push origin HEAD:agent/node-mongo-catalog-bridge
