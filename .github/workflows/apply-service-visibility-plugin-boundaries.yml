name: Apply service visibility plugin boundary correction

on:
  push:
    branches:
      - agent/wordpress-service-visibility-rebuild
    paths:
      - .github/workflows/apply-service-visibility-plugin-boundaries.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wordpress-service-visibility-rebuild
          fetch-depth: 0
      - name: Apply scheduled-sync and draft-retry safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          plugin_path = Path("apps/wordpress-service-visibility/includes/class-catora-service-visibility.php")
          text = plugin_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Expected {label} pattern not found")

          replace_once(
              "\tpublic static function activate(): void {\n\t\tif ( ! wp_next_scheduled( self::CRON_HOOK ) ) {\n\t\t\twp_schedule_event( time() + 300, 'daily', self::CRON_HOOK );\n\t\t}\n\t}\n",
              "\tpublic static function activate(): void {\n\t\twp_clear_scheduled_hook( self::CRON_HOOK );\n\t}\n",
              "activation schedule",
          )

          replace_once(
              "\t\tadd_action( 'admin_init', array( $this, 'register_settings' ) );\n\t\tadd_action( 'admin_post_catora_service_visibility_sync', array( $this, 'manual_sync' ) );\n\t\tadd_action( self::CRON_HOOK, array( $this, 'sync' ) );\n",
              "\t\tadd_action( 'admin_init', array( $this, 'register_settings' ) );\n\t\tadd_action( 'admin_init', array( $this, 'reconcile_schedule' ), 20 );\n\t\tadd_action( 'admin_post_catora_service_visibility_sync', array( $this, 'manual_sync' ) );\n\t\tadd_action( self::CRON_HOOK, array( $this, 'scheduled_sync' ) );\n",
              "constructor hooks",
          )

          replace_once(
              "\t\t\t'token'         => $token,\n\t\t\t'enable_drafts' => ! empty( $input['enable_drafts'] ),\n",
              "\t\t\t'token'                 => $token,\n\t\t\t'enable_scheduled_sync' => ! empty( $input['enable_scheduled_sync'] ),\n\t\t\t'enable_drafts'         => ! empty( $input['enable_drafts'] ),\n",
              "settings sanitization",
          )

          replace_once(
              "\t\t\t\t\t<tr><th scope=\"row\">Approved drafts</th><td><label><input name=\"<?php echo esc_attr( self::OPTION ); ?>[enable_drafts]\" type=\"checkbox\" value=\"1\" <?php checked( ! empty( $settings['enable_drafts'] ) ); ?>> Create unpublished draft copies for proposals explicitly approved in Catora</label></td></tr>\n",
              "\t\t\t\t\t<tr><th scope=\"row\">Scheduled snapshots</th><td><label><input name=\"<?php echo esc_attr( self::OPTION ); ?>[enable_scheduled_sync]\" type=\"checkbox\" value=\"1\" <?php checked( ! empty( $settings['enable_scheduled_sync'] ) ); ?>> Run one read-only snapshot daily</label><p class=\"description\">Disabled by default. Enable only after the site owner and Catora operator approve recurring monitoring.</p></td></tr>\n\t\t\t\t\t<tr><th scope=\"row\">Approved drafts</th><td><label><input name=\"<?php echo esc_attr( self::OPTION ); ?>[enable_drafts]\" type=\"checkbox\" value=\"1\" <?php checked( ! empty( $settings['enable_drafts'] ) ); ?>> Create unpublished draft copies for proposals explicitly approved in Catora</label></td></tr>\n",
              "settings UI",
          )

          manual_end = "\tpublic function manual_sync(): void {\n\t\tif ( ! current_user_can( 'manage_options' ) ) {\n\t\t\twp_die( esc_html__( 'Insufficient permissions.', 'catora-service-visibility' ) );\n\t\t}\n\t\tcheck_admin_referer( 'catora_service_visibility_sync' );\n\t\t$this->sync();\n\t\twp_safe_redirect( admin_url( 'options-general.php?page=catora-service-visibility' ) );\n\t\texit;\n\t}\n"
          schedule_methods = manual_end + "\n\tpublic function reconcile_schedule(): void {\n\t\t$enabled = ! empty( $this->settings()['enable_scheduled_sync'] );\n\t\t$scheduled = wp_next_scheduled( self::CRON_HOOK );\n\t\tif ( $enabled && false === $scheduled ) {\n\t\t\twp_schedule_event( time() + 300, 'daily', self::CRON_HOOK );\n\t\t} elseif ( ! $enabled && false !== $scheduled ) {\n\t\t\twp_clear_scheduled_hook( self::CRON_HOOK );\n\t\t}\n\t}\n\n\tpublic function scheduled_sync(): void {\n\t\tif ( empty( $this->settings()['enable_scheduled_sync'] ) ) {\n\t\t\twp_clear_scheduled_hook( self::CRON_HOOK );\n\t\t\treturn;\n\t\t}\n\t\t$this->sync();\n\t}\n"
          replace_once(manual_end, schedule_methods, "schedule methods")

          method_start = text.index("\tprivate function apply_draft( array $draft ): void {")
          method_end = text.index("\n\tprivate function path( string $suffix ): string {", method_start)
          new_method = '''\tprivate function apply_draft( array $draft ): void {
\t\t$proposal_id = sanitize_text_field( (string) $draft['id'] );
\t\t$existing = get_posts(
\t\t\tarray(
\t\t\t\t'post_type'      => 'any',
\t\t\t\t'post_status'    => 'draft',
\t\t\t\t'posts_per_page' => 1,
\t\t\t\t'fields'         => 'ids',
\t\t\t\t'meta_key'       => '_catora_proposal_id',
\t\t\t\t'meta_value'     => $proposal_id,
\t\t\t)
\t\t);
\t\tif ( ! empty( $existing ) ) {
\t\t\t$this->request(
\t\t\t\t'POST',
\t\t\t\t$this->path( '/drafts/' . rawurlencode( $proposal_id ) . '/result' ),
\t\t\t\tarray( 'status' => 'applied', 'remote_draft_id' => (int) $existing[0] ),
\t\t\t\t'draft-result:' . $proposal_id
\t\t\t);
\t\t\treturn;
\t\t}

\t\t$post = get_post( (int) $draft['wordpress_post_id'] );
\t\t$result = array( 'status' => 'failed', 'error' => 'Original post is unavailable.' );
\t\tif ( $post instanceof WP_Post ) {
\t\t\tif ( (string) $post->post_modified_gmt !== (string) ( $draft['base_revision'] ?? '' ) ) {
\t\t\t\t$result = array( 'status' => 'stale', 'error' => 'The original post changed after approval.' );
\t\t\t} else {
\t\t\t\t$proposal = is_array( $draft['proposal'] ?? null ) ? $draft['proposal'] : array();
\t\t\t\t$is_elementor = (bool) get_post_meta( $post->ID, '_elementor_edit_mode', true );
\t\t\t\t$content = $is_elementor ? $post->post_content : (string) ( $proposal['content'] ?? $post->post_content );
\t\t\t\t$draft_id = wp_insert_post(
\t\t\t\t\tarray(
\t\t\t\t\t\t'post_type'    => $post->post_type,
\t\t\t\t\t\t'post_status'  => 'draft',
\t\t\t\t\t\t'post_parent'  => $post->ID,
\t\t\t\t\t\t'post_title'   => (string) ( $proposal['title'] ?? $post->post_title ),
\t\t\t\t\t\t'post_content' => $content,
\t\t\t\t\t\t'post_excerpt' => $post->post_excerpt,
\t\t\t\t\t),
\t\t\t\t\ttrue
\t\t\t\t);
\t\t\t\tif ( is_wp_error( $draft_id ) ) {
\t\t\t\t\t$result = array( 'status' => 'failed', 'error' => $draft_id->get_error_message() );
\t\t\t\t} else {
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_source_post_id', $post->ID );
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_proposal_id', $proposal_id );
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_proposed_meta_title', sanitize_text_field( (string) ( $proposal['meta_title'] ?? '' ) ) );
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_proposed_meta_description', sanitize_textarea_field( (string) ( $proposal['meta_description'] ?? '' ) ) );
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_proposed_structured_data', wp_json_encode( $proposal['structured_data'] ?? null ) );
\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_proposed_internal_links', wp_json_encode( $proposal['internal_links'] ?? array() ) );
\t\t\t\t\tif ( $is_elementor ) {
\t\t\t\t\t\tupdate_post_meta( $draft_id, '_catora_review_note', 'Elementor structure was not modified. Review the proposal metadata and content brief manually.' );
\t\t\t\t\t}
\t\t\t\t\t$result = array( 'status' => 'applied', 'remote_draft_id' => (int) $draft_id );
\t\t\t\t}
\t\t\t}
\t\t}
\t\t$this->request( 'POST', $this->path( '/drafts/' . rawurlencode( $proposal_id ) . '/result' ), $result, 'draft-result:' . $proposal_id );
\t}
'''
          text = text[:method_start] + new_method + text[method_end:]
          plugin_path.write_text(text)

          readme_path = Path("apps/wordpress-service-visibility/README.md")
          readme = readme_path.read_text()
          old_readme = "The token must be supplied through an approved secret channel. Rotate it in Catora if it is exposed.\n"
          new_readme = old_readme + "\nScheduled snapshots are disabled by default. Manual snapshots remain available; enable the daily schedule only after the site owner and Catora operator approve recurring monitoring. Draft delivery reuses an existing local draft for the same Catora proposal if a result callback must be retried.\n"
          if old_readme in readme:
              readme = readme.replace(old_readme, new_readme, 1)
          elif new_readme not in readme:
              raise SystemExit("Expected plugin README insertion point not found")
          readme_path.write_text(readme)

          validator_path = Path("scripts/validate_service_visibility_release.py")
          validator = validator_path.read_text()
          old_check = '''        _check(
              "plugin.service_visibility.safety",
              "wp_insert_post"
              in "\\n".join(path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php"))
              and "'draft'"
              in "\\n".join(path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php"))
              and "wp_update_post"
              not in "\\n".join(path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")),
              "plugin creates separate drafts and does not update live posts",
              "plugin must create separate drafts and must not update live posts",
          ),
'''
          new_check = old_check + '''        _check(
              "plugin.service_visibility.explicit_schedule",
              "enable_scheduled_sync" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              )
              and "scheduled_sync" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              ),
              "scheduled snapshots require explicit WordPress opt-in",
              "scheduled snapshots must remain disabled until explicitly enabled",
          ),
          _check(
              "plugin.service_visibility.draft_retry_idempotency",
              "_catora_proposal_id" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              )
              and "get_posts" in "\\n".join(
                  path.read_text(encoding="utf-8") for path in plugin_dir.rglob("*.php")
              ),
              "approved draft retries reuse the existing proposal draft",
              "draft delivery must not create duplicates after callback failures",
          ),
'''
          if old_check in validator:
              validator = validator.replace(old_check, new_check, 1)
          elif new_check not in validator:
              raise SystemExit("Expected release validator plugin safety check not found")
          validator_path.write_text(validator)
          PY
      - name: Validate plugin and release boundary
        run: |
          find apps/wordpress-service-visibility -name '*.php' -print0 | xargs -0 -n1 php -l
          python scripts/validate_service_visibility_release.py
          bash apps/wordpress-service-visibility/build-plugin.sh artifacts/service-visibility/catora-service-visibility.zip
          unzip -t artifacts/service-visibility/catora-service-visibility.zip
      - name: Commit safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/wordpress-service-visibility/includes/class-catora-service-visibility.php \
            apps/wordpress-service-visibility/README.md \
            scripts/validate_service_visibility_release.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Require explicit plugin schedules and deduplicate drafts'
          git push origin HEAD:agent/wordpress-service-visibility-rebuild
