name: One-shot presenter preflight wait patch

on:
  push:
    branches: [agent/wait-presenter-preflight]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[presenter-wait-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/wait-presenter-preflight
          fetch-depth: 0
      - name: Wait for async presenter readiness result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/staging_browser_certification.py')
          text = path.read_text(encoding='utf-8')
          old = '''    status = page.get_by_text("Ready to present", exact=True)\n    fallback = page.get_by_text("Using verified fallback", exact=True)\n    if status.count() == 0 and fallback.count() == 0:\n        raise RuntimeError("presenter preflight produced no explicit readiness state")\n'''
          new = '''    status = page.get_by_text("Ready to present", exact=True)\n    fallback = page.get_by_text("Using verified fallback", exact=True)\n    status.or_(fallback).first.wait_for(state="visible", timeout=20_000)\n'''
          if old not in text:
              raise SystemExit('Expected presenter preflight assertion was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-presenter-preflight-wait.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/staging_browser_certification.py .github/workflows/patch-presenter-preflight-wait.yml
          git commit -m 'Wait for presenter preflight readiness [presenter-wait-patched]'
          git push origin HEAD:agent/wait-presenter-preflight
