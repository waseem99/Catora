name: CI maintenance inventory

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/api/alembic.ini'
      - 'apps/api/pyproject.toml'
      - 'apps/api/tests/test_ci_maintenance.py'

permissions:
  contents: write

jobs:
  apply-maintenance:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply mechanical maintenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@v6',
              'actions/setup-node@v4': 'actions/setup-node@v6',
              'actions/setup-python@v5': 'actions/setup-python@v6',
              'actions/upload-artifact@v4': 'actions/upload-artifact@v6',
          }
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          alembic_path = Path('apps/api/alembic.ini')
          alembic = alembic_path.read_text()
          marker = 'prepend_sys_path = .\n'
          if 'path_separator = os' not in alembic:
              if marker not in alembic:
                  raise SystemExit('Alembic prepend_sys_path marker not found')
              alembic = alembic.replace(marker, marker + 'path_separator = os\n', 1)
          alembic_path.write_text(alembic)

          pyproject_path = Path('apps/api/pyproject.toml')
          pyproject = pyproject_path.read_text()
          if '"httpx2==2.7.0"' not in pyproject:
              marker = 'dev = [\n'
              if marker not in pyproject:
                  raise SystemExit('Python dev dependency marker not found')
              pyproject = pyproject.replace(marker, marker + '  "httpx2==2.7.0",\n', 1)
          pytest_marker = '[tool.pytest.ini_options]\nasyncio_mode = "auto"\ntestpaths = ["tests"]\n'
          pytest_replacement = (
              '[tool.pytest.ini_options]\n'
              'asyncio_mode = "auto"\n'
              'testpaths = ["tests"]\n'
              'filterwarnings = [\n'
              '  "error:Using httpx with starlette.testclient is deprecated.*:DeprecationWarning",\n'
              ']\n'
          )
          if 'Using httpx with starlette.testclient is deprecated' not in pyproject:
              if pytest_marker not in pyproject:
                  raise SystemExit('Pytest configuration marker not found')
              pyproject = pyproject.replace(pytest_marker, pytest_replacement, 1)
          pyproject_path.write_text(pyproject)
          PY

          cat > apps/api/tests/test_ci_maintenance.py <<'PY'
          from pathlib import Path

          REPOSITORY_ROOT = Path(__file__).resolve().parents[3]
          LEGACY_ACTIONS = {
              "actions/checkout@v4",
              "actions/setup-node@v4",
              "actions/setup-python@v5",
              "actions/upload-artifact@v4",
          }


          def test_first_party_actions_use_node24_compatible_majors() -> None:
              workflow_root = REPOSITORY_ROOT / ".github" / "workflows"
              workflow_text = "\n".join(
                  path.read_text()
                  for path in sorted(workflow_root.glob("*.yml"))
              )
              assert not LEGACY_ACTIONS.intersection(workflow_text.split())
              assert "actions/checkout@v6" in workflow_text
              assert "actions/setup-node@v6" in workflow_text
              assert "actions/setup-python@v6" in workflow_text
              assert "actions/upload-artifact@v6" in workflow_text


          def test_httpx2_and_alembic_compatibility_are_pinned() -> None:
              pyproject = (REPOSITORY_ROOT / "apps" / "api" / "pyproject.toml").read_text()
              alembic = (REPOSITORY_ROOT / "apps" / "api" / "alembic.ini").read_text()
              assert '"httpx2==2.7.0"' in pyproject
              assert "Using httpx with starlette.testclient is deprecated" in pyproject
              assert "path_separator = os" in alembic
          PY

          rm .github/workflows/ci-maintenance-inventory.yml
      - name: Commit maintenance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Modernize CI runtimes and framework compatibility'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
